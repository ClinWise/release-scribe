name: Setup pnpm workspace
description: Configure Node.js and pnpm, restore caches, and install dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: true
  cache-suffix:
    description: Extra cache key suffix for matrix jobs.
    required: false
    default: default
  registry-url:
    description: npm registry URL for publishing (optional).
    required: false
    default: ''
  scope:
    description: npm scope for registry authentication (optional).
    required: false
    default: ''
  save-turbo-cache:
    description: Whether to save the restored Turbo cache after the job.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.30.3

    - name: Configure Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Restore Turbo local cache
      if: inputs.save-turbo-cache == 'false'
      uses: actions/cache/restore@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-suffix }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-suffix }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

    - name: Restore and save Turbo local cache
      if: inputs.save-turbo-cache == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-suffix }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-suffix }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
