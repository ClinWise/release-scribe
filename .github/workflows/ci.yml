name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  NODE_ENV: development
  VITE_API_BASE_URL: ${{ vars.CI_API_BASE_URL }}
  VITE_APP_ENV: ci

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.detect.outputs.api }}
      packages: ${{ steps.detect.outputs.packages }}
      web: ${{ steps.detect.outputs.web }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Affected Groups
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          api=false
          packages=false
          root=false
          web=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          else
            before_sha="${{ github.event.before }}"
            if [[ -n "$before_sha" && "$before_sha" != "0000000000000000000000000000000000000000" ]]; then
              changed_files="$(git diff --name-only "$before_sha" HEAD)"
            else
              changed_files="$(git show --pretty='' --name-only HEAD)"
            fi
          fi

          echo "Changed files:"
          if [[ -n "$changed_files" ]]; then
            printf '%s\n' "$changed_files"
          else
            echo "(none)"
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/*|.github/**/*|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json|turbo.json)
                root=true
                ;;
            esac

            case "$file" in
              apps/api/*|apps/api/**/*|packages/database/*|packages/database/**/*)
                api=true
                ;;
            esac

            case "$file" in
              apps/web/*|apps/web/**/*)
                web=true
                ;;
            esac

            case "$file" in
              packages/*|packages/**/*)
                packages=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$root" == "true" ]]; then
            api=true
            packages=true
            web=true
          fi

          {
            echo "api=$api"
            echo "packages=$packages"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"

          echo "CI groups: api=$api packages=$packages web=$web"

  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          save-turbo-cache: 'false'

      - name: Build Shared Packages
        run: pnpm turbo run ci:build --filter=./packages/*

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          save-turbo-cache: 'false'

      - name: API lint
        run: pnpm turbo run ci:lint --filter=@app/api

      - name: API build
        run: pnpm turbo run ci:build --filter=@app/api

      - name: API test
        run: pnpm turbo run ci:test:unit --filter=@app/api

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          save-turbo-cache: 'false'

      - name: Web lint
        run: pnpm turbo run ci:lint --filter=@app/web

      - name: Web test
        run: pnpm turbo run ci:test:unit --filter=@app/web

      - name: Web build
        run: pnpm turbo run ci:build --filter=@app/web

  ci:
    name: CI
    needs:
      - changes
      - packages
      - api
      - web
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Parallel Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Complete
        run: echo "Selected CI jobs passed or were skipped."
